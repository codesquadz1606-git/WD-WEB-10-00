<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>BIRD</h1>
        </div>
        <div class="navigation">
            <ul>
                <li>Products</li>
                <li>Pricing</li>
                <li>Customer</li>
                <li>Partners</li>
                <li>Resources</li>
            </ul>
        </div>
        <div class="buttons">
            <button class="btn btn1">Get a Demo</button>
            <button class="btn btn2">Log in</button>
        </div>
    </header>
    <section>
        <div class="left-content">
            <div class="content">
                <div style="font-size: 3.5rem; font-weight: bolder;">
                    Personalised <span style="color: blueviolet;">Email Marketing</span> scaled for impact
                </div>
                <p style="font-size: 2rem; width: 80%; margin-top: 15px; font-weight: bolder;">
                    <span style="color: grey;">One unified platform to</span> enhance engagement, increase conversions, <span style="color: grey;">and</span> grow your revenue
                </p>
                <input type="text" placeholder="Enter Your Email"> <br>
                <button class="sub">See Bird</button>
            </div>
        </div>
        <div class="right-content">
            <div class="img-box">
                
            </div>
        </div>
    </section>
