<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend align="center">Registration Form</legend>
            <label for="fname">First Name :</label>
            <input type="text" placeholder="Enter your First name" id="fname">
            <br>
            <label for="">Last Name :</label>
            <input type="text" placeholder="Enter your Last name">
            <br>
            <label for="">Date of birth :</label>
            <input type="date">
            <br>
            <label for="">Create Password :</label>
            <input type="password">
            <br>
            <label for="">Email :</label>
            <input type="email">
            <br>
            <label for="">Gender :</label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <br>
            <label for="">Hobbies :</label>
            <input type="checkbox">Playing
            <input type="checkbox">Reading
            <input type="checkbox">Writing
            <br>
            <label for="">Education:</label>
            <select name="" id="">
                <option value="">--Select any one--</option>
                <option value="">10th Pass</option>
                <option value="">12th Pass</option>
                <option value="">Graduated</option>
                <option value="">Post Graduated</option>
            </select>
            <br>
            <label for="">Share Feedback :</label>
            <textarea name="" id=""></textarea>
            <br>
            <label for="">Phone N :</label>
            <input type="number">
            <br>
            <input type="file">
            <br>

            <input type="submit" value="Save">
            <input type="reset" value="Delete">
        </fieldset>
    </form>
</body>
</html>
